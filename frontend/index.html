<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Line Live Monitoring - Mini MES</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --running: #16a34a;
      --idle: #eab308;
      --down: #dc2626;
      --offline: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px 32px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 2px solid #1e293b;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .sync-box {
      background: #1e293b;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 28px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 28px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card.RUNNING { border-color: var(--running); }
    .card.IDLE { border-color: var(--idle); }
    .card.OFFLINE { border-color: var(--offline); opacity: 0.8; }

    /* Highlight mencolok untuk mesin DOWN agar terbaca dari jarak 3 meter */
    .card.DOWN {
      border-color: #ff2e2e;
      background: linear-gradient(180deg, #450a0a 0%, #131b2e 65%);
      animation: downPulse 1.4s infinite alternate;
    }

    @keyframes downPulse {
      from { box-shadow: 0 0 16px rgba(220, 38, 38, 0.45); }
      to   { box-shadow: 0 0 42px rgba(239, 68, 68, 0.95); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 12px;
    }

    .machine-id {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 1px;
    }

    .machine-name {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .status-badge {
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      white-space: nowrap;
    }

    .badge-RUNNING { background-color: var(--running); color: #ffffff; }
    .badge-IDLE { background-color: var(--idle); color: #090d16; }
    .badge-DOWN { background-color: var(--down); color: #ffffff; }
    .badge-OFFLINE { background-color: var(--offline); color: #f8fafc; }

    .reason-alert {
      background-color: #dc2626;
      color: #ffffff;
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
      border: 2px solid #fca5a5;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .metric-box {
      background: rgba(9, 13, 22, 0.65);
      padding: 18px 10px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #1e293b;
    }

    .metric-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .val-reject { color: #f87171; }
    .val-hot { color: #ef4444; }

    .card-footer {
      border-top: 1px solid #1e293b;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .card-footer strong {
      color: #e2e8f0;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PRODUCTION LINE MONITORING</h1>
      <div class="subtitle">Real-Time Machine Status, Output &amp; Temperature (Auto-Refresh 4s)</div>
    </div>
    <div class="sync-box" id="sync-status">Menghubungkan ke server...</div>
  </header>

  <main class="grid" id="machine-grid"></main>

  <script>
    const machineGrid = document.getElementById('machine-grid');
    const syncStatus = document.getElementById('sync-status');

    // Otomatis deteksi apakah dibuka via server Express atau langsung file/Live Server
    const API_BASE = window.location.port === '3000' ? '' : 'http://localhost:3000';

    function formatLastSeen(isoString) {
      if (!isoString) return 'Belum ada data';
      const date = new Date(isoString);
      return date.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }) + ' WIB';
    }

    async function loadMachines() {
      try {
        const response = await fetch(`${API_BASE}/api/machines`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const machines = await response.json();

        // Urutkan agar mesin DOWN selalu tampil paling atas/awal
        const priorityOrder = { DOWN: 1, RUNNING: 2, IDLE: 3, OFFLINE: 4 };
        machines.sort((a, b) => (priorityOrder[a.status] || 99) - (priorityOrder[b.status] || 99));

        machineGrid.innerHTML = machines.map(m => {
          const isDown = m.status === 'DOWN';
          const hasTemp = m.temperature_c !== null && m.temperature_c !== undefined;
          const tempText = hasTemp ? `${Number(m.temperature_c).toFixed(1)}°C` : 'N/A';
          const isOverheat = hasTemp && Number(m.temperature_c) >= 70;

          return `
            <article class="card ${m.status}">
              <div>
                <div class="card-header">
                  <div>
                    <div class="machine-id">${m.machine_id}</div>
                    <div class="machine-name">${m.name}</div>
                  </div>
                  <div class="status-badge badge-${m.status}">${m.status}</div>
                </div>

                ${isDown ? `<div class="reason-alert">⚠ ALARM: ${m.reason || 'MACHINE DOWN'}</div>` : ''}
              </div>

              <div>
                <div class="metrics">
                  <div class="metric-box">
                    <div class="metric-label">Output</div>
                    <div class="metric-value">${m.today_output}</div>
                  </div>
                  <div class="metric-box">
                    <div class="metric-label">Reject</div>
                    <div class="metric-value val-reject">${m.today_reject}</div>
                  </div>
                  <div class="metric-box">
                    <div class="metric-label">Suhu Motor</div>
                    <div class="metric-value ${isOverheat ? 'val-hot' : ''}">${tempText}</div>
                  </div>
                </div>

                <div class="card-footer">
                  <span>Update Terakhir</span>
                  <strong>${formatLastSeen(m.last_seen_at)}</strong>
                </div>
              </div>
            </article>
          `;
        }).join('');

        const nowText = new Date().toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        syncStatus.textContent = `● Live Sync: ${nowText} WIB`;
        syncStatus.style.color = '#4ade80';
      } catch (error) {
        syncStatus.textContent = `✕ Koneksi Terputus (${error.message})`;
        syncStatus.style.color = '#f87171';
      }
    }

    loadMachines();
    setInterval(loadMachines, 4000);
  </script>
</body>
</html>
